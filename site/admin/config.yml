  # ─── Trading Terms Documents ───────────────────────────────────────────
  - name: "trading-terms"
    label: "Trading Terms Documents"
    media_folder: "site/assets/docs"
    public_folder: "/assets/docs"
    files:
      - name: "documents"
        label: "Documents"
        file: "site/data/trading-terms.json"
        fields:
          - label: "Documents"
            name: "documents"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Document Title", name: "title", widget: "string"}
              - {label: "Category Label", name: "category", widget: "string", hint: "e.g. Terms · General"}
              - {label: "Description", name: "description", widget: "text"}
              - label: "PDF File"
                name: "filename"
                widget: "file"
                hint: "Upload the PDF — or enter a path like /assets/docs/my-file.pdf"
                allow_multiple: false
