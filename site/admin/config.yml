  # ─── Site Photography ─────────────────────────────────────────────────
  - name: "site-images"
    label: "Site Photography"
    files:
      - name: "images"
        label: "Photo Slots"
        file: "site/data/images.json"
        fields:
          - {label: "Hero / Port photo", name: "hero", widget: "image", hint: "Homepage hero photo"}
          - {label: "Citrus grading photo", name: "citrus", widget: "image"}
          - {label: "PNG camp collage", name: "camp_collage", widget: "image"}
          - {label: "PNG camp wide", name: "camp_wide", widget: "image"}
          - {label: "Mine site photo", name: "minesite", widget: "image"}
          - {label: "Packing / 3PL photo", name: "packing", widget: "image"}
          - {label: "Dairy products photo", name: "dairy", widget: "image"}
          - {label: "Export / containers photo", name: "export", widget: "image"}
          - {label: "FMCG grocery photo", name: "fmcg", widget: "image"}

  # ─── Page text — Home ─────────────────────────────────────────────────
